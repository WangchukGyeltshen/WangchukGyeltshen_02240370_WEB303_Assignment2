# docker-compose.yml
# Starts the whole system with one command: docker compose up
#
#   Postman -> gateway (REST :8080) -> permit-service (gRPC) -> route-service (gRPC)
#                                            |                        |
#                                        permit-db                route-db
#
# Each service has its OWN Postgres container (Database per Service).
# All values come from the .env file.

name: trekking-permits

services:
  # ---------- Database for Route Service ----------
  route-db:
    image: postgres:16-alpine
    container_name: route-db
    environment:
      POSTGRES_DB: ${ROUTE_DB_NAME}
      POSTGRES_USER: ${ROUTE_DB_USER}
      POSTGRES_PASSWORD: ${ROUTE_DB_PASSWORD}
    volumes:
      - route-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ROUTE_DB_USER} -d ${ROUTE_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- Database for Permit Service ----------
  permit-db:
    image: postgres:16-alpine
    container_name: permit-db
    environment:
      POSTGRES_DB: ${PERMIT_DB_NAME}
      POSTGRES_USER: ${PERMIT_DB_USER}
      POSTGRES_PASSWORD: ${PERMIT_DB_PASSWORD}
    volumes:
      - permit-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PERMIT_DB_USER} -d ${PERMIT_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- Route Service (Service B) ----------
  route-service:
    build:
      context: .
      dockerfile: route-service/Dockerfile
    container_name: route-service
    environment:
      GRPC_PORT: ${ROUTE_GRPC_PORT}
      DB_HOST: route-db
      DB_PORT: "5432"
      DB_USER: ${ROUTE_DB_USER}
      DB_PASSWORD: ${ROUTE_DB_PASSWORD}
      DB_NAME: ${ROUTE_DB_NAME}
    ports:
      - "${ROUTE_GRPC_PORT}:${ROUTE_GRPC_PORT}"   # exposed so gRPC can be tested directly
    depends_on:
      route-db:
        condition: service_healthy
    restart: unless-stopped

  # ---------- Permit Service (Service A) ----------
  permit-service:
    build:
      context: .
      dockerfile: permit-service/Dockerfile
    container_name: permit-service
    environment:
      GRPC_PORT: ${PERMIT_GRPC_PORT}
      DB_HOST: permit-db
      DB_PORT: "5432"
      DB_USER: ${PERMIT_DB_USER}
      DB_PASSWORD: ${PERMIT_DB_PASSWORD}
      DB_NAME: ${PERMIT_DB_NAME}
      ROUTE_SERVICE_ADDR: route-service:${ROUTE_GRPC_PORT}
      ROUTE_TIMEOUT_MS: ${ROUTE_TIMEOUT_MS}
      ROUTE_MAX_ATTEMPTS: ${ROUTE_MAX_ATTEMPTS}
      ROUTE_BACKOFF_MS: ${ROUTE_BACKOFF_MS}
      CB_FAILURE_THRESHOLD: ${CB_FAILURE_THRESHOLD}
      CB_OPEN_SECONDS: ${CB_OPEN_SECONDS}
    ports:
      - "${PERMIT_GRPC_PORT}:${PERMIT_GRPC_PORT}"
    depends_on:
      permit-db:
        condition: service_healthy
      route-service:
        condition: service_started
    restart: unless-stopped

  # ---------- API Gateway ----------
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gateway
    environment:
      HTTP_PORT: ${GATEWAY_HTTP_PORT}
      ROUTE_SERVICE_ADDR: route-service:${ROUTE_GRPC_PORT}
      PERMIT_SERVICE_ADDR: permit-service:${PERMIT_GRPC_PORT}
      REQUEST_TIMEOUT_MS: ${GATEWAY_REQUEST_TIMEOUT_MS}
    ports:
      - "${GATEWAY_HTTP_PORT}:${GATEWAY_HTTP_PORT}"
    depends_on:
      - route-service
      - permit-service
    restart: unless-stopped

volumes:
  route-db-data:
  permit-db-data: